[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sociodrift-video-ai"
version = "0.1.0"
description = "SocioDrift Video AI Pipeline: automated video segmentation, computer vision scene analysis, and cinematic music prompt generation"
readme = "README.md"
authors = [
    { name = "SocioDrift Team" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
sociodrift-ai = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
